<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>새벽민턴 AI 연결 승인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/oauth-consent.css?v=2026111502">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="/oauth-consent.js?v=2026111502" defer></script>
</head>
<body>
  <main class="oauth-shell">
    <section class="oauth-card" aria-live="polite">
      <div class="oauth-brand"><span>AM</span><strong>새벽민턴</strong></div>
      <div class="oauth-icon" aria-hidden="true">↗</div>
      <h1>AI 연결 승인</h1>
      <p class="oauth-lead">AI 앱이 강창원님의 새벽민턴 경기 기록에 접근하려고 합니다.</p>

      <div id="oauth-loading" class="oauth-status">연결 요청을 확인하고 있습니다…</div>
      <div id="oauth-error" class="oauth-error" hidden></div>

      <form id="oauth-login" class="oauth-login" hidden>
        <p>새벽민턴 계정으로 먼저 로그인해 주세요.</p>
        <label>이메일<input id="oauth-email" type="email" autocomplete="email" required></label>
        <label>비밀번호<input id="oauth-password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">로그인</button>
        <button class="kakao" id="oauth-kakao" type="button">카카오로 로그인</button>
      </form>

      <div id="oauth-consent" hidden>
        <div class="oauth-client">
          <span>연결 앱</span><strong id="oauth-client-name">ChatGPT</strong>
          <small id="oauth-client-uri"></small>
        </div>
        <div class="oauth-member"><span>연결 계정</span><strong>강창원</strong></div>
        <h2>허용되는 기능</h2>
        <ul>
          <li><b>경기 조회</b><span>승인된 경기와 개인 기록 확인</span></li>
          <li><b>점수지 내검</b><span>선수·점수·라운드 오류 검사</span></li>
          <li><b>경기 승인 등록</b><span>검증 완료된 경기 결과 등록</span></li>
        </ul>
        <p class="oauth-warning">승인 후에도 실제 경기 등록 시 ChatGPT에서 다시 확인을 요청할 수 있습니다.</p>
        <div class="oauth-actions">
          <button id="oauth-deny" class="secondary" type="button">취소</button>
          <button id="oauth-approve" class="primary" type="button">연결 허용</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
